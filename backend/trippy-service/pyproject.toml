[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "convia-trippy-service"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "convia-contracts==0.1.0",
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "langchain==1.4.2",
    "langchain-openrouter==0.2.9",
    "httpx>=0.27,<1",
    "pydantic>=2.11,<3",
]

[tool.uv.sources]
convia-contracts = { path = "../../packages/contracts", editable = true }

[project.optional-dependencies]
fireworks = ["langchain-fireworks==1.6.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/trippy_service"]
