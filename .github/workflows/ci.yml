name: CI
on:
  push:
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --locked --project backend/trippy-service
      - run: uv sync --locked --project backend/media-worker
      - run: uv sync --locked --project ai
      - run: uv run --project backend/trippy-service python -m compileall -q backend/trippy-service/src ai/src packages/contracts/generated/python
      - run: uv run --project backend/trippy-service python -c "import trippy_service.app; import convia_contracts.types"
      - run: uv run --project backend/trippy-service python packages/contracts/scripts/validate-python.py
      - run: uv run --project backend/media-worker python -c "import media_worker.worker"
